<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="curveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <!-- Background circle with subtle paper tint -->
  <rect width="120" height="120" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Coordinate grid lines -->
  <line x1="20" y1="30" x2="105" y2="30" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="20" y1="55" x2="105" y2="55" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="20" y1="80" x2="105" y2="80" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="45" y1="15" x2="45" y2="95" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="70" y1="15" x2="70" y2="95" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="95" y1="15" x2="95" y2="95" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Axes -->
  <line x1="20" y1="95" x2="105" y2="95" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="20" y1="95" x2="20" y2="15" stroke="#475569" stroke-width="2"/>

  <!-- Lagrange Interpolation Polynomial Curve -->
  <path d="M 22 28 C 35 70, 45 88, 60 85 C 75 82, 85 65, 102 75" 
        fill="none" stroke="url(#curveGrad)" stroke-width="3" stroke-linecap="round"/>

  <!-- Experimental Data Nodes -->
  <circle cx="28" cy="35" r="4" fill="#1e3a8a" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="48" cy="78" r="4" fill="#1e3a8a" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="75" cy="84" r="4" fill="#1e3a8a" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="98" cy="74" r="4" fill="#1e3a8a" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Interpolated Point (P(6), highlighted red) -->
  <circle cx="62" cy="85" r="5" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Math symbol 'L' badge -->
  <text x="78" y="32" font-family="'Times New Roman', Georgia, serif" font-size="20" font-style="italic" font-weight="bold" fill="#0f172a">P<tspan font-size="13" dy="4">3</tspan><tspan font-size="16" dy="-4">(x)</tspan></text>
</svg>
